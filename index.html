<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1622" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernweg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Lernweg</title>
<style>
:root{
  --bg:#f1f5f9;--card:#ffffff;--ink:#142538;--muted:#4f5f72;--line:#d2dde8;--soft:#e3ebf3;
  --court:#1f5296;--court-soft:#dfe8f4;--good-soft:#ddf1e5;
  --m:#1f8fa6;--e:#c0603a;--d:#3f7d4f;--r:#7a58a8;--b:#1f7f86;--w:#b0782a;
  --warn:#be442c;--warn-soft:#f8e1da;--good:#2b8457;
  --r1:#e3ebf3;--r2:#c3d0de;
  --tab:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0c1622;--card:#132233;--ink:#e4ecf5;--muted:#a0b1c6;--line:#283c54;--soft:#1b2e44;
  --court:#7fa9ff;--court-soft:#1b2e44;--good-soft:#16362a;
  --m:#5cc3d8;--e:#e48d68;--d:#7fbf8d;--r:#b296de;--b:#5fc0c6;--w:#d9a95c;
  --warn:#ff8c75;--warn-soft:#43221b;--good:#6dd19e;--r1:#1b2e44;--r2:#35506e;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 24px)}
h1,h2,h3{line-height:1.2;margin:0;font-family:"Baloo 2",Nunito,sans-serif;font-weight:700}
h1{font-weight:800}
.fun{font-family:"Baloo 2",Nunito,sans-serif;font-weight:700}
h1{font-size:1.55rem;letter-spacing:-.01em}
h2{font-size:1.08rem}
h3{font-size:.98rem}
p{margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{padding:calc(env(safe-area-inset-top) + 18px) 0 10px}
.top .row1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.stack>*+*{margin-top:12px}
.stack-s>*+*{margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card+.card,.sec+.sec{margin-top:14px}
.sec{margin-top:22px}
.sec>h2{margin:0 0 10px 2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-width:0}
.tile .lbl{font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tile .big{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.tile .sub{font-size:.76rem;color:var(--muted)}
.delta{font-size:.78rem;font-weight:600}
.delta.up{color:var(--good)}.delta.down{color:var(--warn)}.delta.eq{color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.days .d{aspect-ratio:1;border-radius:6px;background:var(--r1);display:flex;align-items:center;justify-content:center;font-size:.62rem;color:var(--muted)}
.days .d.on{background:var(--court);color:#fff}
.days .d.slam{box-shadow:inset 0 0 0 2px #f5a524}
.days .d.today{outline:2px solid var(--ink);outline-offset:1px}
.dl{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:3px}
.dl span{font-size:.6rem;text-align:center;color:var(--muted)}
.hint{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.hint:first-of-type{border-top:0;padding-top:2px}
.hint .ic{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.hint.look .ic{background:var(--warn-soft)}
.hint.good .ic{background:var(--good-soft)}
.skill{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.skill:first-child{border-top:0}
.skill .nm{font-weight:600;font-size:.92rem;min-width:0}
.skill .meta{font-size:.78rem;color:var(--muted);grid-column:1/-1;display:flex;gap:10px;align-items:center}
.bar{height:7px;border-radius:4px;background:var(--r1);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px}
.lv{display:flex;gap:3px;align-items:center}
.lv i{width:16px;height:8px;border-radius:3px;background:var(--r1)}
.lv i.on{background:var(--m)}
.stackbar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--r1);margin:8px 0 6px}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.pill{display:inline-block;font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:600;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;padding:0;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--court)}
.text{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:1rem;line-height:1.55}
.diff del{color:var(--warn);text-decoration:line-through;text-decoration-thickness:1.5px}
.diff ins{color:var(--good);text-decoration:none;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
table.t th{text-align:right;font-weight:600;color:var(--muted);font-size:.74rem;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
.tscroll{overflow-x:auto;margin:0 -4px}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{list-style:none;cursor:pointer;padding:11px 0;display:flex;align-items:center;gap:10px;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary .chev{transition:transform .15s;color:var(--muted);flex:none}
details[open]>summary .chev{transform:rotate(90deg)}
.item{padding:8px 0;border-top:1px dashed var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.item:first-child{border-top:0}
.item .q{min-width:0;flex:1}
.ans{color:var(--good);font-weight:600}
.opt{display:inline-block;margin:3px 6px 0 0;font-size:.82rem;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--muted)}
.opt.right{background:var(--good-soft);color:var(--good);font-weight:600}
.pips{display:flex;gap:2px;flex:none;padding-top:5px}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--r1)}
.pips i.on{background:var(--e)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{fill:var(--muted);font-size:9.5px;font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.note{font-size:.8rem;color:var(--muted);margin-top:8px}
.login{max-width:420px;margin:12vh auto 0}
.inp{width:100%;font:inherit;font-size:1rem;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 16px;background:var(--court);color:#fff;font-weight:700;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto;padding:8px 12px;font-weight:600;font-size:.88rem}
.err{color:var(--warn);font-size:.88rem}
.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.9rem}
.lvltab{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:6px}
.lvltab td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.lvltab td:first-child{width:62px;color:var(--muted);font-weight:600;white-space:nowrap}
.lvltab tr.cur td{background:var(--court-soft)}
.lvltab tr.cur td:first-child{color:var(--good)}
.ex{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;color:var(--muted)}
.mark{background:color-mix(in srgb,#f5a524 30%,transparent);border-radius:3px;padding:0 2px}
/* ---------- Lernweg und Manifest ---------- */
:root{--band:#15385c;--band-ink:#ffffff;--gold:#f5a524;--gold-ink:#8a4b00;--gold-soft:#fdeacb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--band:#07111d;--band-ink:#f2f6fa;--gold:#f7b547;--gold-ink:#f9c76e;--gold-soft:#3a2a10}}
.btn.sm{width:auto;padding:9px 14px;font-size:.9rem}
.btn.ghost.light{color:var(--band-ink);border-color:rgba(255,255,255,.3)}
.row-btn{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:inherit}
.linkbtn.light{color:var(--band-ink);opacity:.75}
.iconbtn{background:var(--soft);border:0;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted);flex:none}
.hero{background:var(--band);color:var(--band-ink);border-radius:18px;padding:20px 18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;border:44px solid rgba(245,165,36,.1);pointer-events:none}
.hero>*{position:relative}
.hero-h{font-size:1.5rem;line-height:1.15;margin:4px 0 6px;letter-spacing:-.01em}
.hero-p{font-size:.95rem;opacity:.85}
.hero-q{margin-top:12px;font-size:1.15rem;font-weight:700;line-height:1.25}
.steer{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.steer-row{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;font-size:.82rem}
.steer-bar{display:flex;height:11px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12)}
.steer-bar i{display:block;height:100%}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:-1px;margin:0 3px 0 6px}
.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.station{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.station.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.st-num{width:28px;height:28px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800}
.station.on .st-num{background:var(--gold);color:#142538}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.st-grid>div{background:var(--soft);border-radius:10px;padding:10px}
.klbl{font-weight:800;letter-spacing:.06em;color:var(--gold-ink)}
@media (max-width:560px){.stations,.st-grid{grid-template-columns:1fr}}
.lw-banner{background:var(--gold-soft);border-radius:14px;padding:12px 14px}
.lw-ok{background:var(--good-soft);color:var(--good);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem}
.who{display:inline-block;margin-right:10px;color:var(--muted)}
.who.yes{color:var(--good);font-weight:700}
.ed-l{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.ed-l .inp,textarea.inp{font-weight:400;color:var(--ink);font-size:.95rem;padding:9px 10px;resize:vertical;font-family:inherit}
.ed-item{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ed-item:first-child{border-top:0;padding-top:0}
.ed-num{width:26px;height:26px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex:none}
.ed-ctl{display:flex;flex-direction:column;gap:6px}
.mf-item{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.mf-item:first-of-type{border-top:0}
.mf-n{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.mf-item.p .mf-n{background:var(--court-soft);color:var(--good)}
.mf-item.k .mf-n{background:var(--gold-soft);color:var(--gold-ink)}
.note-form{display:flex;gap:8px;align-items:flex-end}
.note-form textarea{flex:1}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:.72rem;font-weight:700;opacity:.6}
.stamp .ring{width:48px;height:48px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:1.3rem;filter:grayscale(1)}
.stamp.on{opacity:1}
.stamp.on .ring{border:2px solid var(--gold);background:var(--gold);filter:none}
.passbar{height:7px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin:12px 0 6px}
.passbar i{display:block;height:100%;background:var(--gold)}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rule{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-height:110px}
.rule .rn{font-size:1.5rem;font-weight:800;color:var(--gold-ink);line-height:1}
.rule.on{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.rule.on .rn{color:var(--gold)}
.tier{margin-top:10px}
.tier .batt{display:inline-flex;gap:2px;vertical-align:-1px}
.batt i{width:7px;height:10px;border-radius:2px;background:var(--r2)}
.tier-stark .batt i.on{background:var(--good)}.tier-gut .batt i.on{background:var(--gold)}.tier-falle .batt i.on{background:var(--warn)}
.pill .batt{display:inline-flex;gap:2px;vertical-align:-1px}.pill .batt i.on{background:currentColor}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.tool{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.9rem;min-width:0}
.tool.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.tool.trap{border-style:dashed;background:transparent}
.tier-stark .tool{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.ti{font-size:1.25rem;flex:none}
.chk{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;font-size:.75rem;display:flex;align-items:center;justify-content:center}
.steps{margin:4px 0 0;padding-left:20px}
.steps li{margin:3px 0}
.mission{background:var(--band);color:var(--band-ink);border-radius:14px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.clock{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.dice{font-size:1.15rem;font-weight:700;min-height:2.6em}
.ideas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.idea{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.idea.own{border-style:dashed}
.idea.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.proj{background:var(--band);color:var(--band-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.pstat{border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.82rem;cursor:pointer}
.pstat.s0{background:rgba(255,255,255,.16);color:var(--band-ink)}.pstat.s1{background:var(--gold);color:#142538}.pstat.s2{background:var(--good);color:#fff}
.bridge{display:grid;grid-template-columns:1fr 1.3fr;gap:0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.b-m{background:var(--band);color:var(--band-ink);padding:12px 14px}
.b-u{background:var(--card);padding:12px 14px}
@media (max-width:480px){.bridge{grid-template-columns:1fr}}
.balance{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;margin-top:10px}
.balance ul{margin:6px 0 0;padding-left:18px}
.balance .plus{font-size:1.8rem;font-weight:800;color:var(--gold-ink);align-self:center}
table.study td.up{color:var(--good);font-weight:700}table.study td.down{color:var(--warn);font-weight:700}
table.study td,table.study th{white-space:normal}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcol{border-radius:14px;padding:14px}.dcol ul{margin:6px 0 0;padding-left:18px}
.dcol.yes{background:var(--good-soft)}.dcol.yes h3{color:var(--good)}
.dcol.no{background:var(--warn-soft)}.dcol.no h3{color:var(--warn)}
@media (max-width:480px){.dd{grid-template-columns:1fr}}
/* ---------- Wegbegleiter, Landschaft, Pakt ---------- */
:root{--sky1:#bfe0f7;--sky2:#eef6fc;--sun:#f7c75a;--cloud:#ffffff;--mtn2:#7d9cc0;--snow:#ffffff;--hill2:#9cc9a0;--hill1:#6fae7c;--river:#5fa8dd;--trail:#ecd7ad;--trail-dot:#a5824a;--tree:#3f7d4f;--paper:#fffaf0;--paper-line:#efe4cc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--sky1:#0b1d33;--sky2:#1a3352;--sun:#e8e2c4;--cloud:#2c4466;--mtn2:#2b4466;--snow:#c9d6e6;--hill2:#24453a;--hill1:#1b382d;--river:#2f5f8f;--trail:#7a6544;--trail-dot:#c9b083;--tree:#2c5e3c;--paper:#1b2633;--paper-line:#2a3a4d}}
.card,.tile,.station,.rule,.tool,.idea{border-radius:18px}
.btn{border-radius:14px}
.fox{width:84px;height:84px;flex:none;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.15))}
.fox.sm{width:56px;height:56px}.fox.xs{width:40px;height:40px}.fox.md{width:72px;height:72px}
.fox .eyes-open{animation:blinkO 5s infinite}.fox .eyes-closed{opacity:0;animation:blinkC 5s infinite}
.fox.hop{animation:hop .5s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hop{40%{transform:translateY(-14px) scale(1.06,.94)}}
@keyframes blinkO{0%,92%,100%{opacity:1}94%,97%{opacity:0}}

.scene{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:360/230;box-shadow:0 8px 24px rgba(20,37,56,.12)}

.pin{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:var(--card);font-size:1.3rem;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);padding:0}
.pin.done{background:var(--good);color:#fff;font-weight:800}
.pin.now{background:var(--gold)}
.pin.now::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--gold);opacity:.6;animation:pulse 2s ease-out infinite}
.pin.on{outline:3px solid var(--court);outline-offset:2px}
@keyframes pulse{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.scene-fox{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.fox-say{display:flex;gap:10px;align-items:flex-end;text-align:left}
button.fox-say{background:none;border:0;padding:0;width:100%;cursor:pointer;color:inherit;font:inherit;margin-top:12px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:.95rem;flex:1;margin:0}
.fox-say.big .bubble{font-size:1rem}
.sign{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;position:relative}
.sign-top{display:flex;gap:12px;align-items:center}
.sign-ic{width:52px;height:52px;border-radius:16px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:none}
.sign h3{font-size:1.35rem}
.leit{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.leit-c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}

.leit-c h3{font-size:1.1rem}
@media (max-width:560px){.leit{grid-template-columns:1fr}}
.steer.light .steer-bar{background:var(--soft)}
.spur-form{display:flex;flex-direction:column;gap:8px}
.trail-list{position:relative;padding-left:6px}
.trail-list::before{content:"";position:absolute;left:25px;top:8px;bottom:8px;border-left:3px dotted var(--trail-dot);opacity:.6}
.spur{position:relative;display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.spur-ic{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex:none;z-index:1;border:2px solid var(--card)}
.spur-tx{flex:1;min-width:0}
.spur-tx p:first-child{font-weight:700}
.hero-fox{float:right;margin:-4px -4px 4px 10px}

.paper{background:var(--paper);border-radius:20px;padding:18px 16px;border:1px solid var(--paper-line);box-shadow:0 4px 14px rgba(20,37,56,.08)}
.paper.kid{transform:rotate(-.4deg)}
.paper::before{content:"";display:block;width:70px;height:14px;margin:-26px auto 10px;background:var(--gold);opacity:.55;border-radius:3px;transform:rotate(-2deg)}
.paper-h{font-family:Caveat,cursive;font-size:1.9rem;font-weight:700;line-height:1;margin:0 0 8px;color:var(--court)}
.paper.kid .paper-h{color:var(--gold-ink)}
.paper .mf-item{border-top:0;padding:8px 0}
.mf-ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mf-t{font-size:1.08rem;line-height:1.2}
.signs{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:2px dashed var(--paper-line)}

.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--court);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

<script>
/* Eltern-Cockpit – Lernstände, Aufgaben und Entwicklung aus dem Familienspeicher.
   Liest die Inhalte direkt aus den Apps (../lern-match/inhalte.js usw.), damit immer der aktuelle Stoff zu sehen ist. */
(function(){
"use strict";
const FS=window.FamilieSync;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d);};
const dLabel=(s,o)=>new Date(s+"T12:00:00").toLocaleDateString("de-DE",o||{day:"numeric",month:"numeric"});
const wd=s=>["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(s+"T12:00:00").getDay()];
const pct=(ok,n)=>n?Math.round(ok/n*100):null;
const mondayOf=s=>{const d=new Date(s+"T12:00:00");const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d);};
const COL={m:"var(--m)",e:"var(--e)",d:"var(--d)",r:"var(--r)",b:"var(--b)",w:"var(--w)"};
const SUBJ={m:"Mathe",e:"Englisch",d:"Deutsch"};
const CHEV='<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- Inhalte der Apps laden ---------- */
const BASE="../";
function loadScript(src){return new Promise(res=>{const s=document.createElement("script");s.src=src+"?v="+Date.now();s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s);});}
const C={lm:null,faelle:[],tests:[],testData:{}};
async function loadContent(){
  await Promise.all([loadScript(BASE+"lern-match/inhalte.js"),loadScript(BASE+"spuernase/inhalte.js"),loadScript(BASE+"testtrainer/tests.js")]);
  C.lm=window.INHALTE||null;C.faelle=window.FAELLE||[];C.tests=window.TESTS||[];
  for(const t of C.tests){
    ["STATIONEN","GENERALPROBE","MERKSAETZE","SKELETT","ZAEHNE","POSEN","TESTTAG"].forEach(k=>{try{delete window[k];}catch(e){window[k]=undefined;}});
    const ok=await loadScript(BASE+"testtrainer/"+t.ordner+"/inhalte.js");
    if(ok)C.testData[t.ordner]={stationen:window.STATIONEN||[],skelett:window.SKELETT||{},merk:window.MERKSAETZE||null};
  }
  buildIndex();
}
/* Gleiche Kennungen wie in Lern-Match */
const IDX={words:[],eg:[],de:[]};
const DE_CAT={s:"s, ss oder ß",i:"i oder ie",doppel:"Doppelte Mitlaute",ck:"k oder ck",tz:"z oder tz",gross:"Groß und klein",wortart:"Wortarten",fehler:"Fehlerwörter",zeitform:"Zeitformen",steigerung:"Steigern und vergleichen",satzglied:"Subjekt und Prädikat",satzzeichen:"Satzzeichen",rede:"Wörtliche Rede",pronomen:"Pronomen"};
const TB_CAT={gross:"Groß und klein",doppel:"Doppelte Mitlaute",s:"s, ss oder ß",i:"i oder ie",ae:"e oder ä",ck:"k oder ck",tz:"z oder tz",dehnung:"Dehnungs-h",auslaut:"d/t oder g/k am Wortende",dass:"das oder dass",getrennt:"Zusammen oder getrennt",sonst:"Sonstiges"};
const TB_HOW={selbst:"selbst gefunden",tipp:"mit Tipp",tipp2:"mit 2 Tipps",geloest:"Lösung gezeigt"};
function buildIndex(){
  const I=C.lm||{};
  (I.englisch||[]).forEach((u,ui)=>u.woerter.forEach((w,wi)=>IDX.words.push({id:"u"+ui+"-"+wi,u:ui,unit:u.unit,de:w[0],en:w[1],note:w[2]||""})));
  IDX.eg=(I.englischGrammatik||[]).map(x=>({id:"g-"+x[0],s:x[0],o:x[1],a:x[2],tip:x[3]||""}));
  const D=I.deutsch||{},gap=(cat,w,a,o)=>IDX.de.push({id:cat+"-"+w,cat,q:w,o,a,show:w.replace(a,"<b>"+esc(a)+"</b>")});
  (D.s||[]).forEach(([w,a])=>gap("s",w,a,["s","ss","ß"]));
  (D.i||[]).forEach(([w,a])=>gap("i",w,a,["i","ie"]));
  (D.doppel||[]).forEach(([w,a])=>{const dbl=a.length===2&&a[0]===a[1];gap("doppel",w,a,dbl?[a[0],a]:[a,a+a]);});
  (D.ck||[]).forEach(([w,a])=>gap("ck",w,a,["k","ck"]));
  (D.tz||[]).forEach(([w,a])=>gap("tz",w,a,["z","tz"]));
  (D.gross||[]).forEach(([s,a,o])=>IDX.de.push({id:"gross-"+s,cat:"gross",q:s,a,show:esc(s)+' → <b>'+esc(a.charAt(0).toUpperCase()+a.slice(1))+'</b> groß'}));
  (D.wortart||[]).forEach(([w,a])=>IDX.de.push({id:"wa-"+w,cat:"wortart",q:w,a,show:esc(w)+" → <b>"+esc(a)+"</b>"}));
  (D.fehler||[]).forEach(([o,a,c])=>IDX.de.push({id:"fe-"+a,cat:"fehler",q:o.join(" · "),a,show:esc(o.join(" · "))+" → falsch: <s>"+esc(a)+"</s>, richtig: <b>"+esc(c)+"</b>"}));
  (D.extra||[]).forEach(([cat,q,o,a,tip])=>IDX.de.push({id:"x-"+cat+"-"+q+"-"+o[a],cat,q,o,a,tip,show:esc(q)+" → <b>"+esc(o[a])+"</b>"}));
}

/* ---------- Mathe: was jede Stufe verlangt (aus den Aufgaben-Generatoren in Lern-Match) ---------- */
const SKILLS={plus:"Plus im Kopf",minus:"Minus im Kopf",mal:"Mal rechnen",geteilt:"Geteilt rechnen",begriffe:"Fachbegriffe",ueberschlag:"Überschlagen",luecke:"Fehlende Zahl",mauer:"Zahlenmauer",probe:"Probe",schriftlich:"Schriftlich rechnen",text:"Textaufgaben",worte:"Aufgaben mit Worten",geschickt:"Geschickt rechnen",klammer:"Klammern und Punkt vor Strich",groessen:"Größen umrechnen",zeit:"Zeitspannen",schriftmal:"Schriftlich malnehmen",gtext:"Sachaufgaben mit Größen"};
const BASIS=["plus","minus","mal","geteilt","begriffe","ueberschlag","luecke","mauer","probe","schriftlich","text"];
const KAP={2:{n:"Kapitel 2: Addieren und Subtrahieren",s:["worte","geschickt","klammer","schriftlich","ueberschlag","luecke","text"]},3:{n:"Kapitel 3: Mit Größen rechnen",s:["groessen","zeit","gtext"]},5:{n:"Kapitel 5: Multiplizieren und Dividieren",s:["worte","klammer","schriftmal","mal","geteilt","text"]}};
const LEVELS={
  plus:[["Zweistellig plus einstellig","47 + 6"],["Zweistellig plus zweistellig","58 + 37"],["Dreistellig plus zweistellig","436 + 78"]],
  minus:[["Zweistellig minus einstellig","63 − 7"],["Zweistellig minus zweistellig","82 − 37"],["Von 100 oder Dreistelligem zweistellig abziehen","523 − 68"]],
  mal:[["Einmaleins mit 2, 3, 4, 5 und 10","4 · 7"],["Ganzes kleines Einmaleins","7 · 8"],["11 bis 19 mal einstellig, oder mal 10 und mal 100","14 · 6 · 37 · 100"]],
  geteilt:[["Umkehrung der 2er-, 3er-, 4er-, 5er- und 10er-Reihe","35 : 5"],["Umkehrung des kleinen Einmaleins","56 : 8"],["Ergebnis zwischen 11 und 20","84 : 6"]],
  begriffe:[["Summand, Summe, Minuend, Subtrahend, Differenz","58 + 23 = 81 → Wie heißt 23?"],["Zusätzlich Faktor, Produkt, Dividend, Divisor, Quotient","42 : 6 = 7 → Wie heißt 6?"],["Wie Stufe 2","—"]],
  ueberschlag:[["Zwei Zweistellige auf Zehner runden und addieren","47 + 68 ≈ 50 + 70"],["Dreistellig plus oder minus zweistellig","318 + 46 ≈ 320 + 50"],["Dreistellig plus oder minus dreistellig","734 − 289 ≈ 730 − 290"]],
  luecke:[["Lücke bei Plus und Minus","35 + ? = 52"],["Auch bei Mal und Geteilt","6 · ? = 42"],["Wie Stufe 2","? : 7 = 8"]],
  mauer:[["3 Steine unten, Zahlen bis 20","Spitze der Mauer finden"],["3 Steine unten, Zahlen bis 50","—"],["4 Steine unten, Zahlen bis 15","vier Reihen hoch"]],
  probe:[["Zweistellige Minusaufgabe mit der Umkehraufgabe prüfen","84 − 27 = 57?"],["Dreistellige Minusaufgabe prüfen","563 − 78 = 485?"],["Wie Stufe 2","—"]],
  schriftlich:[["Dreistellig plus dreistellig","437 + 268"],["Vierstellig plus, oder dreistellig minus","3482 + 1796 · 812 − 347"],["Vierstellig plus und minus","7215 − 3468"]],
  text:[["Ein Rechenschritt, kleine Zahlen (Wechselgeld, Bälle verteilen)","Griffband 7 € + Flasche 9 €, bezahlt mit 20 €"],["Größere Zahlen, auch Mal (Match-Dauer, Spardose)","Satz 1: 34 Min., Satz 2: 41 Min."],["Auch zwei Rechenschritte","5 Dosen zu je 4 € von 37 € Erspartem"]],
  worte:[["„Summe“, „Differenz“, „vermindere“ … bis 100","Bilde die Differenz von 84 und 29."],["Zahlen bis 500","Subtrahiere 178 von 452."],["Zahlen bis 1000, ab Kapitel 5 auch Produkt und Quotient","Dividiere 96 durch 8."]],
  geschickt:[["Zehner bilden durch Vertauschen","7 + 26 + 3"],["Hunderter bilden","38 + 54 + 62"],["Vier Zahlen, Hunderter bilden","38 + 54 + 62 + 17"]],
  klammer:[["Klammer zuerst, Zahlen bis etwa 60","45 − (18 − 6)"],["Zahlen bis etwa 150","132 − (27 + 18)"],["Zahlen bis etwa 400; ab Kapitel 5 auch Punkt vor Strich","7 + 4 · 6"]],
  groessen:[["Einfach umrechnen: € und ct, m und cm, km und m, kg und g, h und min","3 m = ? cm"],["Gemischte Angaben, auch t und mm","4 m 25 cm = ? cm"],["Kommazahlen","3,45 m = ? cm"]],
  zeit:[["Zeitspanne bis 45 Minuten","14:20 bis 14:55 Uhr"],["Zeitspanne bis knapp 2 Stunden","9:35 bis 10:50 Uhr"],["Zeitspanne von 70 bis 200 Minuten","15:10 bis 17:45 Uhr"]],
  schriftmal:[["Dreistellig mal einstellig","318 · 7"],["Vierstellig mal einstellig","2346 · 6"],["Zweistellig mal zweistellig","47 · 23"]],
  gtext:[["Sachaufgaben mit Gramm, Cent, Metern und Minuten","Ein Ball wiegt 57 g. Wie viel wiegen 4 Bälle?"],["Wie Stufe 1, größere Mengen","—"],["Wie Stufe 1, größere Mengen","—"]]
};

/* ---------- Zustand ---------- */
const S={tab:"heute",sub:"mathe",wsub:"weg",kids:[],kid:null,me:null,members:[],P:{},log:[],daily:[],docs:[],appr:[],notes:[],edit:null,viewV:{},hist:null,station:null,lwMsg:null,loaded:null,err:null,range:28,open:{}};
try{const t=localStorage.getItem("cockpit-tab");if(t)S.tab=t;const s=localStorage.getItem("cockpit-sub");if(s)S.sub=s;const w=localStorage.getItem("cockpit-wsub");if(w)S.wsub=w;}catch(e){}

async function loadKid(){
  const id=S.kid.id,q=encodeURIComponent;
  const [prog,log,daily]=await Promise.all([
    FS.rest("/rest/v1/app_progress?select=app,data,updated_at&member_id=eq."+id),
    FS.rest("/rest/v1/activity_log?select=app,kind,value,occurred_at&member_id=eq."+id+"&order=occurred_at.desc&limit=2000"),

  ]);
  S.P={};(prog||[]).forEach(r=>S.P[r.app]=r);S.log=log||[];S.daily=daily||[];
  const [docs,appr,notes]=await Promise.all([
    FS.rest("/rest/v1/family_docs?select=id,doc,content,note,created_by,created_at&order=id.asc").catch(()=>[]),

const LM=()=>(S.P["lern-match"]||{}).data||null;
const SN=()=>(S.P["spuernase"]||{}).data||null;
const TT=o=>(S.P["testtrainer-"+o]||{}).data||null;

/* ---------- Kennzahlen ---------- */
function histSum(h,from,to){const r={m:[0,0],e:[0,0],d:[0,0]};if(!h)return r;Object.keys(h).forEach(k=>{if(k>=from&&k<=to)["m","e","d"].forEach(s=>{const v=h[k][s];if(v){r[s][0]+=v[0];r[s][1]+=v[1];}});});return r;}
function trainDays(){
  const set={},add=(o,src)=>Object.keys(o||{}).forEach(k=>{(set[k]=set[k]||[]).push(src);});
  const lm=LM(),sn=SN();
  if(lm)add(lm.days,"lm");if(sn){add(sn.days,"sn");add(sn.log,"sn");}
  C.tests.forEach(t=>{const d=TT(t.ordner);if(d)add(d.days,"tt");});
  return set;

function streak(days){let d=today();if(!days[d])d=addDays(d,-1);let n=0;while(days[d]){n++;d=addDays(d,-1);}return n;}
const vocabState=id=>((LM()||{}).en||{})[id];
function vocabBuckets(en){const b={neu:0,wack:0,lern:0,sicher:0};IDX.words.forEach(w=>{const s=en&&en[w.id];if(!s)b.neu++;else if((s.box||0)<=1)b.wack++;else if(s.box<=3)b.lern++;else b.sicher++;});return b;}

/* ---------- Fehler und Einschätzung ---------- */
const TYP={
  "genau-statt-gerundet":"Genau gerechnet statt gerundet","nur-eine-gerundet":"Nur eine Zahl gerundet",

  "ie-statt-i":"ie geschrieben, obwohl das i kurz ist","i-statt-ie":"nur i geschrieben, obwohl das i lang ist",
  "ck-statt-k":"ck, obwohl nur k hingehört","k-statt-ck":"k statt ck nach kurzem Selbstlaut","tz-statt-z":"tz, obwohl nur z hingehört","z-statt-tz":"z statt tz nach kurzem Selbstlaut",
  "schreibweise":"Wort gewusst, ein Buchstabe falsch","fast":"Ähnlich, aber mehrere Buchstaben falsch","verwechselt":"Mit einem anderen Wort verwechselt","leer":"Keine Antwort"};
const TIPS={
  ueberschlag:"Vor dem Rechnen laut sagen lassen, was die Aufgabe will. Erst beide Zahlen auf Zehner runden und aufschreiben, dann rechnen.",
  klammer:"Einmal gemeinsam an einem Beispiel zeigen: Klammer zuerst ausrechnen, das Ergebnis darüber schreiben, dann mit dem Rest weiterrechnen.",

function nice(v){const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}

function wordDiff(a,b){
  const A=a.split(/\s+/).filter(Boolean),B=b.split(/\s+/).filter(Boolean),n=A.length,m=B.length,D=[];

  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=A[i]===B[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  let i=0,j=0,o=[];while(i<n&&j<m){if(A[i]===B[j]){o.push(esc(A[i]));i++;j++;}else if(D[i+1][j]>=D[i][j+1]){o.push("<del>"+esc(A[i])+"</del>");i++;}else{o.push("<ins>"+esc(B[j])+"</ins>");j++;}}
  while(i<n)o.push("<del>"+esc(A[i++])+"</del>");while(j<m)o.push("<ins>"+esc(B[j++])+"</ins>");return o.join(" ");

function cardHTML(k,sk){

    case"match":return esc(k.frage)+`<div class="tiny">${k.paare.map(p=>esc(p[0])+" → "+esc(p[1])).join("<br>")}</div>`;
    case"order":return esc(k.frage)+`<div class="tiny">${k.schritte.map((s,i)=>(i+1)+". "+esc(s)).join("<br>")}</div>`;

/* ---------- Ansicht: Entwicklung ---------- */
function vEntwicklung(){
  const lm=LM(),t=today();
  const ranges=[[14,"2 Wochen"],[28,"4 Wochen"],[91,"3 Monate"],[0,"Alles"]];
  let start=S.range?addDays(t,-S.range+1):null;
  const allDays=[...Object.keys((lm&&lm.hist)||{}),...S.daily.map(d=>d.day),...S.log.map(e=>e.occurred_at.slice(0,10))].sort();
  if(!start||(allDays[0]&&allDays[0]>start))start=allDays[0]||addDays(t,-13);
  const X=[];for(let d=start;d<=t;d=addDays(d,1))X.push(d);
  const XL=X.map(d=>dLabel(d));
  let h=`<div class="chips" style="margin-top:6px">${ranges.map(([n,l])=>`<button class="chip ${S.range===n?"on":""}" data-range="${n}">${l}</button>`).join("")}</div>`;
  if(lm){
    const H=lm.hist||{};
    const roll=k=>X.map(d=>{const s=histSum(H,addDays(d,-6),d)[k];return s[1]>=6?pct(s[0],s[1]):null;});
    if(!KID())h+=`<div class="sec"><h2>Trefferquote</h2><div class="card"><p class="small muted">Anteil richtiger Antworten, gleitend über 7 Tage.</p>
      ${lineChart({x:XL,ymin:0,ymax:100,ticks:[0,50,100],unit:" %",series:["m","e","d"].map(k=>({name:SUBJ[k],c:COL[k],v:roll(k)})),label:"Trefferquote je Fach"})}</div></div>`;
    h+=`<div class="sec"><h2>Übungsmenge</h2><div class="card"><p class="small muted">Beantwortete Aufgaben pro Tag in Lern-Match.</p>
      ${barChart({x:XL,series:["m","e","d"].map(k=>({name:SUBJ[k],c:COL[k],v:X.map(d=>(H[d]&&H[d][k])?H[d][k][1]:0)})),label:"Aufgaben pro Tag"})}${legend(["m","e","d"].map(k=>[SUBJ[k],COL[k]]))}</div></div>`;
    /* Vokabeln: angefangen (exakt aus dem ersten Übungstag) und sicher (aus den Tagesständen) */
    const en=lm.en||{},firsts=Object.values(en).map(s=>s.first).filter(Boolean);
    const started=X.map(d=>firsts.filter(f=>f<=d).length);
    const snapLM=S.daily.filter(r=>r.app==="lern-match");const snapBy={};snapLM.forEach(r=>snapBy[r.day]=r);
    const secure=X.map(d=>{const r=snapBy[d];if(!r||!r.en)return null;return Object.values(r.en).filter(s=>(s.box||0)>=4).length;});
    if(!secure[secure.length-1]&&lm.en)secure[secure.length-1]=Object.values(lm.en).filter(s=>(s.box||0)>=4).length;
    h+=`<div class="sec"><h2>Englisch-Wortschatz</h2><div class="card">${lineChart({x:XL,series:[{name:"Begonnen",c:"color-mix(in srgb,var(--e) 45%,transparent)",v:started},{name:"Sicher",c:"var(--e)",v:secure}],label:"Vokabeln"})}
      <p class="note">„Begonnen“ reicht zurück bis zum ersten Üben. „Sicher“ (Box 4–5) wird erst seit dem 7.11. täglich festgehalten – der Verlauf füllt sich ab jetzt Tag für Tag.</p></div></div>`;
    /* Mathe-Stufen */
    const lvl=X.map(d=>{const r=snapBy[d];const mm=r&&r.m;if(!mm)return null;const ks=Object.keys(mm).filter(k=>mm[k].n);return ks.length?Math.round(ks.reduce((a,k)=>a+mm[k].lvl,0)/ks.length*10)/10:null;});
    if(lvl[lvl.length-1]==null&&lm.m){const ks=Object.keys(lm.m).filter(k=>lm.m[k].n);if(ks.length)lvl[lvl.length-1]=Math.round(ks.reduce((a,k)=>a+lm.m[k].lvl,0)/ks.length*10)/10;}
    h+=`<div class="sec"><h2>Mathe-Stufen</h2><div class="card">${lineChart({x:XL,ymin:1,ymax:3,ticks:[1,2,3],dots:true,series:[{name:"Ø Stufe",c:"var(--m)",v:lvl}],label:"Durchschnittliche Mathe-Stufe"})}
      <p class="note">Durchschnitt über alle geübten Rechenbereiche (1 bis 3). Wird seit dem 7.11. täglich festgehalten.</p></div></div>`;
  }
  /* Lesen */
  const rv=readEvents();
  if(rv.length){const pts=rv.filter(e=>e.value.wpm);
    h+=`<div class="sec"><h2>Lesetempo</h2><div class="card">${pts.length?lineChart({x:pts.map(e=>dLabel(e.occurred_at.slice(0,10))),dots:true,series:[{name:"Tempo",c:"var(--r)",v:pts.map(e=>e.value.wpm)}],label:"Lesetempo je Kapitel"}):""}
      <p class="note">Ein Punkt pro gelesenem Kapitel. Spätere Fälle haben längere Texte – ein leichter Rückgang beim Tempo ist dann normal.</p></div></div>`;}
  /* Schreiben */
  const tbe=S.log.filter(e=>e.app==="lern-match"&&e.kind==="tiebreak").slice().reverse();
  if(tbe.length){
    h+=`<div class="sec"><h2>Schreiben</h2><div class="card">
      ${lineChart({x:tbe.map(e=>dLabel(e.occurred_at.slice(0,10))),dots:true,series:[{name:"Wörter",c:"var(--w)",v:tbe.map(e=>e.value.woerter||0)},{name:"Fehler",c:"var(--warn)",v:tbe.map(e=>e.value.fehler||0)}],label:"Tie-Break"})}
      <p class="note">Ein Punkt pro Tie-Break. Gutes Zeichen: mehr Wörter bei gleich vielen oder weniger Fehlern – und mehr selbst gefundene Fehler.</p></div></div>`;}
  /* Wochentabelle */
  if(lm&&!KID()){const H=lm.hist||{},days=trainDays(),wk={};
    Object.keys(days).concat(Object.keys(H)).forEach(d=>{if(d<start)return;const w=mondayOf(d);wk[w]=wk[w]||{days:new Set(),n:0,s:{m:[0,0],e:[0,0],d:[0,0]},slams:0};if(days[d])wk[w].days.add(d);});
    Object.keys(H).forEach(d=>{const w=mondayOf(d);if(!wk[w])return;["m","e","d"].forEach(k=>{const v=H[d][k];if(v){wk[w].s[k][0]+=v[0];wk[w].s[k][1]+=v[1];wk[w].n+=v[1];}});});
    Object.keys(lm.slams||{}).forEach(d=>{const w=mondayOf(d);if(wk[w])wk[w].slams++;});
    const rows=Object.keys(wk).sort().reverse();const cell=s=>s[1]?pct(s[0],s[1])+" %":"–";
    h+=`<div class="sec"><h2>Wochen im Vergleich</h2><div class="card tscroll"><table class="t"><thead><tr><th>Woche ab</th><th>Tage</th><th>Aufgaben</th><th>Mathe</th><th>Englisch</th><th>Deutsch</th><th>Slams</th></tr></thead><tbody>
      ${rows.map(w=>`<tr><td>${dLabel(w,{day:"numeric",month:"short"})}</td><td>${wk[w].days.size}</td><td>${wk[w].n}</td><td>${cell(wk[w].s.m)}</td><td>${cell(wk[w].s.e)}</td><td>${cell(wk[w].s.d)}</td><td>${wk[w].slams||""}</td></tr>`).join("")}</tbody></table></div></div>`;}
  return h;
}

function docState(doc){
  const vs=S.docs.filter(v=>v.doc===doc).sort((a,b)=>a.id-b.id);
  const ap=id=>S.appr.filter(a=>a.version_id===id).map(a=>a.member_id);
  const full=v=>S.members.length&&S.members.every(m=>ap(v.id).includes(m.id));
  let cur=null;vs.forEach(v=>{if(full(v))cur=v;});
  const latest=vs[vs.length-1]||null,pending=latest&&latest!==cur?latest:null;
  return {vs,cur,pending,latest,ap,full,shown:cur||latest};
}
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const fmtDT=s=>new Date(s).toLocaleString("de-DE",{day:"numeric",month:"numeric",year:"2-digit",hour:"2-digit",minute:"2-digit"});

function vEditor(){

  const inp=(path,val,long,lbl)=>long?`<label class="ed-l">${esc(lbl)}<textarea class="inp ed" rows="3" data-ed="${path}">${esc(val||"")}</textarea></label>`:`<label class="ed-l">${esc(lbl)}<input class="inp ed" data-ed="${path}" value="${esc(val||"")}"></label>`;
  let h=`<div class="sec"><div class="card stack"><h2>${esc(Dd.name)} ändern</h2><p class="small muted">Deine Änderungen werden ein Vorschlag. Er gilt, sobald alle zugestimmt haben. Die bisherige Fassung bleibt im Verlauf.</p></div></div>`;
  (Dd.texts||[]).forEach(([k,l])=>{h+=`<div class="sec"><div class="card">${inp("t|"+k,d[k],1,l)}</div></div>`;});
  if(Dd.station)h+=`<div class="sec"><div class="card"><p class="small"><b>Wo stehen wir gerade?</b></p><div class="chips" style="flex-wrap:wrap">${(d.stationen||[]).map((s,i)=>`<button class="chip ${d.aktuell===i?"on":""}" data-ed-st="${i}">${i+1}. ${esc(s.t)}</button>`).join("")}</div></div></div>`;
  Dd.secs.forEach(sec=>{const list=d[sec.k]||[];
    h+=`<div class="sec"><h2>${esc(sec.n)}</h2><div class="card">${list.map((it,i)=>`<div class="ed-item"><div class="ed-num">${i+1}</div><div style="flex:1;min-width:0" class="stack-s">${sec.f.map(([f,l,long])=>inp(sec.k+"|"+i+"|"+f,it[f],long,l)).join("")}</div>${sec.fixed?"":`<div class="ed-ctl"><button class="iconbtn" data-ed-up="${sec.k}|${i}" aria-label="Nach oben">↑</button><button class="iconbtn" data-ed-del="${sec.k}|${i}" aria-label="Streichen">✕</button></div>`}</div>`).join("")}
      ${sec.fixed?"":`<button class="btn ghost" data-ed-add="${sec.k}">+ Punkt dazu</button>`}</div></div>`;});
  h+=`<div class="sec"><div class="card stack">${inp("note",E.note,1,"Was hast du geändert und warum? (für den Verlauf)")}
    <div class="row-btn"><button class="btn sm" data-lw="save">Als Vorschlag speichern</button><button class="btn ghost" data-lw="cancel">Abbrechen</button></div>
    ${S.lwMsg?`<p class="err">${esc(S.lwMsg)}</p>`:""}</div></div>`;
  return h;
}

let FOX_INNER=null;
function foxSVG(cls){

  if(d.lw==="view"){S.viewV[d.doc]=d.id?+d.id:null;S.hist=null;render();scrollTo(0,0);return true;}
  if(d.lw==="hist"){S.hist=S.hist===d.doc?null:d.doc;render();return true;}
  if(d.lw==="edit"){const D=docState(d.doc);S.edit={doc:d.doc,draft:clone((D.pending||D.shown||{}).content),note:""};S.lwMsg=null;render();scrollTo(0,0);return true;}
  if(d.lw==="cancel"){S.edit=null;S.lwMsg=null;render();return true;}
  if(d.lw==="save"){docPropose();return true;}
  if(d.lw==="ndel"){noteDel(d.id);return true;}
  if(d.edSt!=null&&S.edit){S.edit.draft.aktuell=+d.edSt;render();return true;}
  if(d.edAdd&&S.edit){const sec=DOCS[S.edit.doc].secs.find(x=>x.k===d.edAdd);(S.edit.draft[d.edAdd]=S.edit.draft[d.edAdd]||[]).push(Object.fromEntries(sec.f.map(([f])=>[f,""])));render();return true;}
  if(d.edDel&&S.edit){const [k,i]=d.edDel.split("|");S.edit.draft[k].splice(+i,1);render();return true;}
  if(d.edUp&&S.edit){const [k,i]=d.edUp.split("|"),a=S.edit.draft[k],j=+i;if(j>0)[a[j-1],a[j]]=[a[j],a[j-1]];render();return true;}
  return false;
}
document.addEventListener("input",e=>{
  const el=e.target;if(!S.edit||!el.dataset||!el.dataset.ed)return;const p=el.dataset.ed.split("|");
  if(p[0]==="note")S.edit.note=el.value;else if(p[0]==="t")S.edit.draft[p[1]]=el.value;else S.edit.draft[p[0]][+p[1]][p[2]]=el.value;
});
document.addEventListener("submit",e=>{
  const f=e.target;
  if(f.id==="spur-form"){e.preventDefault();const t=document.getElementById("spur-text").value.trim();if(t){S.spurDraft="";noteAdd("spur",(S.spurCat||"schule")+"::"+t);}return;}
  if(f.classList.contains("note-form")){e.preventDefault();const t=f.querySelector("textarea").value.trim();if(t)noteAdd(f.dataset.topic,t);return;}
  if(f.id==="planner"){e.preventDefault();const thema=document.getElementById("p-thema").value.trim(),was=document.getElementById("p-was").value.trim();
    if(!thema){UIW.err="Schreib noch ein Thema rein.";UIW.was=was;render();return;}
    const st=LWS();st.projects.push({id:Date.now(),idea:UIW.idea,thema,was,who:UIW.who.slice(),due:UIW.due,s:0});UIW.err=null;UIW.thema="";lwSave(st);}
},true);

/* ---------- Gerüst ---------- */
function header(){
  const tm=S.loaded?S.loaded.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"";
  const lastSync=Object.entries(S.P).filter(([k])=>k!=="lernweg").map(([,r])=>r.updated_at).sort().pop();
  const ago=lastSync?new Date(lastSync).toLocaleString("de-DE",{weekday:"short",day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}):null;
  const fam=S.tab==="weg"||S.tab==="manifest";
  const title=S.tab==="weg"?(KID()?"Dein Lernweg":"Unser Lernweg"):S.tab==="manifest"?"Unser Manifest":KID()?({heute:"Mein Stand",aufgaben:"Meine Aufgaben",entwicklung:"Meine Entwicklung"}[S.tab]):esc(S.kid.display_name);
  return `<header class="top"><div class="row1"><div><div class="kicker">${fam?"Lernweg · Familie":KID()?"Lernweg · "+esc(S.kid.display_name):"Lernweg · Eltern-Cockpit"}</div><h1>${title}</h1></div>
    <button class="btn ghost" data-act="reload" aria-label="Neu laden">↻ ${tm}</button></div>
    ${S.me&&S.me.role==="parent"?(S.preview?`<div class="lw-banner small row-btn" style="justify-content:space-between;margin-top:10px"><span>👁 <b>Vorschau:</b> So sieht ${firstName()} die Seite.</span><button class="btn sm" data-act="preview">Vorschau beenden</button></div>`:`<button class="chip" style="margin-top:10px" data-act="preview">👁 Als ${firstName()} ansehen</button>`):""}
    ${fam?"":S.kids.length>1?`<div class="chips" style="margin-top:10px">${S.kids.map(k=>`<button class="chip ${k.id===S.kid.id?"on":""}" data-kid="${k.id}">${esc(k.display_name)}</button>`).join("")}</div>`:""}
    ${ago&&!fam?`<p class="small muted" style="margin-top:4px">Zuletzt geübt und abgeglichen: ${ago} Uhr</p>`:""}</header>`;
}
function render(){
  const app=$("#app"),tabs=$("#tabs");
  if(!FS.session()){tabs.hidden=true;app.innerHTML=vLogin();return;}
  if(S.err&&!S.kid){tabs.hidden=true;app.innerHTML=`<div class="login card stack"><h2>Lernweg</h2><p class="err">${esc(S.err)}</p><button class="btn" data-act="reload">Nochmal versuchen</button><button class="btn ghost" data-act="out">Abmelden</button></div>`;return;}
  if(!S.kid){tabs.hidden=true;app.innerHTML=`<p class="muted" style="margin-top:30vh;text-align:center"><span class="spin"></span></p>`;return;}
  tabs.hidden=false;tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  const hl=tabs.querySelector('[data-l="heute"]');if(hl)hl.textContent=KID()?"Mein Stand":"Überblick";
  const v={weg:vWeg,manifest:vManifest,heute:vHeute,aufgaben:vAufgaben,entwicklung:vEntwicklung}[S.tab]||vHeute;
  app.innerHTML=header()+(S.err?`<p class="err" style="margin:6px 0">${esc(S.err)}</p>`:"")+v()+`<p class="tiny muted" style="text-align:center;margin-top:28px">Angemeldet als ${esc((FS.member()||{}).display_name||"")} · <button data-act="out" style="background:none;border:0;padding:0;text-decoration:underline;color:inherit;font-size:inherit;cursor:pointer">Abmelden</button></p>`;
}
function vLogin(){
  return `<div class="login stack"><div><div class="kicker">Familienspeicher</div><h1>Unser Lernweg</h1></div>
    <p class="muted small">Weg, Manifest, Lernstände und Entwicklung – für die ganze Familie. Jeder meldet sich mit seinem eigenen Konto an.</p>
    <form id="login" class="stack"><input class="inp" id="mail" type="email" autocomplete="username" placeholder="E-Mail" value="${esc(S.mail||"")}" required>
    <input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="Passwort" required>
    <button class="btn" type="submit" ${S.busy?"disabled":""}>${S.busy?"Melde an …":"Anmelden"}</button></form>
    ${S.loginErr?`<p class="err">${esc(S.loginErr)}</p>`:""}
    <p class="tiny muted">Wer in einer der Apps schon angemeldet ist, ist es hier automatisch auch.</p></div>`;
}
async function boot(){
  S.err=null;
  if(!FS.session()){render();return;}
  render();
  try{
    const m=FS.member()||await FS.loadMember();
    if(!m){S.err="Dieses Konto gehört noch zu keiner Familie.";render();return;}
    S.me=m;
    if(!C.lm)await loadContent();
    const all=await FS.familyMembers();S.members=all||[];S.kids=m.role==="child"?S.members.filter(x=>x.id===m.id):S.members.filter(x=>x.role==="child");
    if(!S.kids.length){S.err="In der Familie ist noch kein Kind angelegt.";render();return;}
    const keep=S.kid&&S.kids.find(k=>k.id===S.kid.id);S.kid=keep||S.kids[0];
    await loadKid();
  }catch(e){S.err=navigator.onLine===false||e instanceof TypeError?"Gerade kein Internet.":"Laden fehlgeschlagen: "+e.message;}
  render();
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-tab],summary");if(!b)return;
  if(b.matches("summary")){const d=b.parentElement;if(d.dataset.k)setTimeout(()=>{S.open[d.dataset.k]=d.open;},0);return;}
  if(lwClick(b))return;
  const tab=b.dataset.tab,sub=b.dataset.sub,go=b.dataset.go;
  if(tab){S.tab=tab;S.edit=null;S.hist=null;S.lwMsg=null;try{localStorage.setItem("cockpit-tab",tab);}catch(x){}render();scrollTo(0,0);return;}
  if(sub||go){S.sub=sub||go;S.tab="aufgaben";try{localStorage.setItem("cockpit-sub",S.sub);localStorage.setItem("cockpit-tab","aufgaben");}catch(x){}render();if(go)scrollTo(0,0);return;}
  if(b.dataset.range!=null){S.range=+b.dataset.range;render();return;}
  if(b.dataset.toggle){S.open[b.dataset.toggle]=!S.open[b.dataset.toggle];render();return;}
  if(b.dataset.kid){S.kid=S.kids.find(k=>k.id===b.dataset.kid);S.P={};S.log=[];S.daily=[];render();boot();return;}
  if(b.dataset.act==="preview"){S.preview=!S.preview;S.edit=null;S.hist=null;render();scrollTo(0,0);return;}
  if(b.dataset.act==="reload"){boot();return;}
  if(b.dataset.act==="out"){await FS.signOut();S.kid=null;S.kids=[];S.me=null;S.preview=false;S.members=[];S.P={};S.docs=[];S.appr=[];S.notes=[];S.edit=null;S.err=null;render();}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="login")return;e.preventDefault();
  S.mail=$("#mail").value;const pw=$("#pw").value;S.busy=true;S.loginErr=null;render();
  FS.signIn(S.mail,pw).then(()=>{S.busy=false;boot();}).catch(err=>{S.busy=false;S.loginErr=err.message;render();});
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.loaded&&Date.now()-S.loaded>5*60e3)boot();});
boot();
})();
